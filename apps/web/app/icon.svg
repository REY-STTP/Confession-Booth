<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Confession Booth" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#2a1a45"/>
      <stop offset="45%" stop-color="#160f22"/>
      <stop offset="100%" stop-color="#0a0810"/>
    </radialGradient>

    <linearGradient id="flameFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f2ecff"/>
      <stop offset="28%" stop-color="#c9a9fa"/>
      <stop offset="62%" stop-color="#9b6ff0"/>
      <stop offset="100%" stop-color="#5b2fae"/>
    </linearGradient>

    <radialGradient id="flameHalo" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#c9a9fa" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#7c4fe0" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#7c4fe0" stop-opacity="0"/>
    </radialGradient>

  </defs>

  <!-- background: quiet candlelight sanctuary -->
  <rect x="0" y="0" width="512" height="512" fill="url(#bgGlow)"/>

  <!-- soft ambient halo behind the flame -->
  <circle cx="256" cy="252" r="190" fill="url(#flameHalo)"/>

  <!-- confession flame, with a keyhole punched through its body: a truth held in guarded privacy -->
  <path fill-rule="evenodd" fill="url(#flameFill)" d="
    M 256 120
    C 300 176 332 214 332 268
    C 332 324 298 366 256 366
    C 214 366 180 324 180 268
    C 180 214 212 176 256 120
    Z
    M 256 230
    a 34 34 0 1 0 0.1 0
    Z
    M 240 288 L 272 288 L 283 340 Q 256 354 229 340 Z
  "/>

  <!-- rim light along the flame's outer edge -->
  <path d="
    M 256 120
    C 300 176 332 214 332 268
    C 332 324 298 366 256 366"
    fill="none" stroke="#f2ecff" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round"/>
</svg>
