services:
  postgres:
    image: postgres:16-alpine
    container_name: booth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-booth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-booth}
      POSTGRES_DB: ${POSTGRES_DB:-booth}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - booth-pgdata:/var/lib/postgresql/data
      # Backup harian (T1-040): mount direktori backup host.
      - ./backups:/backups
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-booth} -d ${POSTGRES_DB:-booth}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: booth-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Wajib (boot fatal di production bila kosong — config.ts):
      DATABASE_URL: ${DATABASE_URL:-postgres://booth:booth@postgres:5432/booth}
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-change-me}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      APP_DOMAIN: ${APP_DOMAIN:-booth.local}
      # Chain/publisher (boleh kosong di dev → worker skip aman):
      RPC_URL: ${RPC_URL:-}
      RPC_WS_URL: ${RPC_WS_URL:-}
      PUBLISHER_KEY: ${PUBLISHER_KEY:-}
      NEXT_PUBLIC_CHAIN_ID: ${NEXT_PUBLIC_CHAIN_ID:-11155111}
      NEXT_PUBLIC_CONTRACT_ADDRESS: ${NEXT_PUBLIC_CONTRACT_ADDRESS:-0x0000000000000000000000000000000000000000}
      # Storage Fase 1.5 (nullable di MVP):
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-}
      STORAGE_API_KEY: ${STORAGE_API_KEY:-}
      STORAGE_API_SECRET: ${STORAGE_API_SECRET:-}
      # Hardening 1.5 (opsional, ada default aman):
      REDIS_URL: ${REDIS_URL:-}
      POW_DIFFICULTY: ${POW_DIFFICULTY:-14}
      CAPTCHA_SECRET: ${CAPTCHA_SECRET:-}
      # Admin bootstrap (server-only, JANGAN NEXT_PUBLIC_*):
      ADMIN_SECRET: ${ADMIN_SECRET:-}
      ADMIN_WALLETS: ${ADMIN_WALLETS:-}
      MODERATOR_WALLETS: ${MODERATOR_WALLETS:-}
      NODE_ENV: ${NODE_ENV:-production}
    ports:
      - '4000:4000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_CHAIN_ID: ${NEXT_PUBLIC_CHAIN_ID:-11155111}
        NEXT_PUBLIC_CONTRACT_ADDRESS: ${NEXT_PUBLIC_CONTRACT_ADDRESS:-0x0000000000000000000000000000000000000000}
    container_name: booth-web
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
      NEXT_PUBLIC_CHAIN_ID: ${NEXT_PUBLIC_CHAIN_ID:-11155111}
      NEXT_PUBLIC_CONTRACT_ADDRESS: ${NEXT_PUBLIC_CONTRACT_ADDRESS:-0x0000000000000000000000000000000000000000}
    ports:
      - '3000:3000'

  publisher:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: booth-publisher
    restart: unless-stopped
    depends_on:
      - api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://booth:booth@postgres:5432/booth}
      RPC_URL: ${RPC_URL:-}
      RPC_WS_URL: ${RPC_WS_URL:-}
      PUBLISHER_KEY: ${PUBLISHER_KEY:-}
      CHAIN_ID: ${CHAIN_ID:-11155111}
      CONTRACT_ADDRESS: ${CONTRACT_ADDRESS:-}
    command: node ./dist/workers/publisher.js

  # Backup PG harian (T1-040): `docker compose --profile backup run backup`.
  backup:
    image: postgres:16-alpine
    profiles: ['backup']
    depends_on:
      - postgres
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-booth}
      PGPASSWORD: ${POSTGRES_PASSWORD:-booth}
      PGDATABASE: ${POSTGRES_DB:-booth}
    volumes:
      - ./backups:/backups
    command: sh -c "pg_dump -Fc -f /backups/booth-$$(date +%F).dump"

volumes:
  booth-pgdata:
