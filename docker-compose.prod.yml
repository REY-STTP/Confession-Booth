# Override produksi VPS (T1G): Caddy TLS otomatis + restart policy.
# API-only (web di Vercel). Pakai: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build api postgres caddy
# Akses publik HANYA via 80/443 Caddy; port service lain dijaga UFW (lihat docs/VPS.md).
services:
  api:
    restart: unless-stopped

  web:
    restart: unless-stopped

  postgres:
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: booth-caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    # PENTING: placeholder {$...} di Caddyfile dibaca dari ENV container,
    # bukan dari file .env host — harus diteruskan eksplisit di sini.
    # `:?` membuat compose gagal cepat bila API_DOMAIN lupa diisi.
    environment:
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN wajib di-set di .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - booth-caddy-data:/data
      - booth-caddy-config:/config
    depends_on:
      - api

volumes:
  booth-caddy-data:
  booth-caddy-config:
